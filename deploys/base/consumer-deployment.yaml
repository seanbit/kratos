---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{APP_NAME}}-consumer
  labels:
    app: {{APP_NAME}}-consumer
    version: {{VERSION}}
spec:
  replicas: 2  # Initial replicas, HPA will manage scaling
  selector:
    matchLabels:
      app: {{APP_NAME}}-consumer
  template:
    metadata:
      labels:
        app: {{APP_NAME}}-consumer
        version: {{VERSION}}
    spec:
      serviceAccountName: {{APP_NAME}}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: consumer
          image: {{IMAGE}}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: ENV_RUN_TYPE
              value: "consumer"
            - name: ENV_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ENV_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ENV_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ENV_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - {{APP_NAME}}-consumer
                topologyKey: kubernetes.io/hostname
