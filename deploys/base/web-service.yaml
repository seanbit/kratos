apiVersion: v1
kind: Service
metadata:
  name: {{APP_NAME}}-web
  labels:
    app: {{APP_NAME}}-web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: grpc
      port: 9000
      targetPort: 9000
      protocol: TCP
  selector:
    app: {{APP_NAME}}-web
