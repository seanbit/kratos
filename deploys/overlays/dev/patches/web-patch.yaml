apiVersion: apps/v1
kind: Deployment
metadata:
  name: evm-scan-web
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: evm-scan-web
          env:
            - name: SECRET_FILE
              value: "secret.yaml"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
