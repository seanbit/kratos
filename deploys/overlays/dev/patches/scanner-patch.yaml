apiVersion: apps/v1
kind: Deployment
metadata:
  name: evm-scan-scanner
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: evm-scan-scanner
          env:
            - name: SECRET_FILE
              value: "secret.yaml"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
