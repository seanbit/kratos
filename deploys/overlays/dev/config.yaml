env: DEV
log_level: Debug
name: web
server:
  http:
    addr: 0.0.0.0:8000
    timeout: 15s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 15s
  asynq:
    redis_uri: redis://:${REDIS_PASSWORD}@192.168.31.201:6379/9
    concurrency: 15
data:
  database:
    driver: "postgres"
    name: "default"
    max_open_connections: 20
    max_idle_connections: 10
    conn_max_lifetime: 360s
    conn_max_idle_time: 180s
    gorm_level: 3
    slow_threshold: 200
  redis:
    addr: "192.168.31.201:6379"
    db: 1
    read_timeout: 2s
    write_timeout: 2s
    max_retry_times: 3
    idle_timeout: 300s
    pool_size: 60
    min_idle_conn: 20
    password: ${REDIS_PASSWORD}
#tracing:
#  host: "opentelemetry-collector.tempo.svc.cluster.local"
#  port: "4317"
#  type: "OTLP"
alarm:
  default_platform: "web"
  web_hooks:
    web: "https://open.larksuite.com/open-apis/bot/v2/hook/fdfb959e-e689-4c12-a5de-385073757176"
  cache_ignore_duration: 43200s
  cache_fuse_duration: 600s
auth:
  jwt_key_25519: ${JWT_KEY_25519}
  login_expires: 86400s
s3:
  access_key: ${AWS_ACCESS_KEY}
  secret_key: ${AWS_SECRET_KEY}
  region: ap-northeast-1
  bucket: carv-public-dev-tk
  host: https://public-dev.carv.io
geo_ip:
  file_bucket: aifk-dev
  file_key: geo_ip_country_common
  local_mode: true

# 区块链配置
blockchain:
  rpc_urls:
    - "https://bsc.blockpi.network/v1/rpc/b5457888e8486a4d609719185365d80a48cf69d1"
    - "https://endpoints.omniatech.io/v1/bsc/mainnet/public"
    - "https://bsc.api.pocket.network"
    - "https://api.zan.top/bsc-mainnet"
    - "https://bsc-mainnet.nodereal.io/v1/64a9df0874fb4a93b9d0a3849de012d3"
  ws_urls:  # WebSocket节点列表（按优先级顺序，断连后依次尝试）
    - "wss://bsc-rpc.publicnode.com"
    - "wss://bsc-ws-node.nariox.org"
    - "wss://bsc.drpc.org"
  rpc_timeout: 30s
  ws_timeout: 60s
  max_retry: 3
  retry_interval: 5s
  max_connections: 50
  delay_sure_blocks: 18

# 扫描器配置
scanner:
  batch_block_size: 2000        # 每次查询2000个区块
  concurrent_contracts: 50      # 同时扫描50个合约
  poll_interval: 12s            # 每12秒检查一次新区块
  max_logs_per_query: 10000     # 单次最多返回10000条日志
  event_batch_size: 1000        # 每1000条事件批量写入一次
  worker_pool_size: 10          # 10个工作协程