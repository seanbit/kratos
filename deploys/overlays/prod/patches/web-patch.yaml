apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{APP_NAME}}-web
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: {{APP_NAME}}-web
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
