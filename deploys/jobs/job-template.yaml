# ============================================================
# K8s Job 模板
# ============================================================
# 使用方法:
# 1. 复制此文件并重命名为: <job-name>.yaml
# 2. 替换所有 {{JOB_NAME}} 为实际的 job 名称
# 3. 根据需要调整资源配额
# 4. 将文件添加到对应环境的 kustomization.yaml 中
# ============================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: {{APP_NAME}}-job-{{JOB_NAME}}
  labels:
    app: {{APP_NAME}}-job
    {{APP_NAME}}/job-name: "{{JOB_NAME}}"
    app.kubernetes.io/name: job
    app.kubernetes.io/component: job
spec:
  # Job 完成后保留时间 (秒), 方便查看日志
  ttlSecondsAfterFinished: 86400
  # 失败重试次数
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: {{APP_NAME}}-job
        {{APP_NAME}}/job-name: "{{JOB_NAME}}"
        app.kubernetes.io/name: job
        app.kubernetes.io/component: job
        app.kubernetes.io/part-of: {{APP_NAME}}
        logging: enabled
      annotations:
        # Promtail 日志收集配置
        promtail.io/collect: "true"
        promtail.io/parser: "json"
    spec:
      restartPolicy: Never
      containers:
        - name: job
          image: {{APP_NAME}}-job
          imagePullPolicy: Always
          # command:
          #   - "./job"
          # args:
          #   - "{{JOB_NAME}}"
          #   - "--config"
          #   - "/data/conf/config.yaml"
          #   - "--secret"
          #   - "secret.yaml"
          # 使用 shell wrapper 以支持 {{JOB_ARGS}} 占位符被 sed 替换后正确拆分参数
          command: ["/bin/sh", "-c"]
          args: ["./job {{JOB_NAME}} --config /data/conf/config.yaml --secret secret.yaml {{JOB_ARGS}}"]
          env:
            - name: ENV_RUN_TYPE
              value: "job"
            - name: ENV_JOB_NAME
              value: "{{JOB_NAME}}"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: config
              mountPath: /data/conf/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: secret
              mountPath: /data/conf/secret.yaml
              subPath: secret.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{APP_NAME}}-config
        - name: secret
          secret:
            secretName: {{APP_NAME}}-secret
      imagePullSecrets:
        - name: harbor-secret
