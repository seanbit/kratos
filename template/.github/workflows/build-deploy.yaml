name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      app_type:
        description: "应用类型"
        required: true
        type: choice
        options:
          - web
          - job
          - cronjob
      environment:
        description: "部署环境"
        required: true
        type: choice
        options:
          - dev
          - prod
      enable_lint:
        description: "启用代码检查 (golangci-lint)"
        required: false
        type: boolean
        default: false

env:
  HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
  HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
  GO_VERSION: "1.24"
  APP_NAME: ${{ vars.APP_NAME }}
  GOPRIVATE: ${{ vars.GOPRIVATE }}

jobs:
  # 代码检查 (可选)
  lint:
    runs-on: ubuntu-latest
    if: inputs.enable_lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          ref: ${{ inputs.environment == 'prod' && 'main' || 'dev' }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Configure Go for private repos
        run: git config --global url."https://${{ secrets.CI_GITHUB_TOKEN }}:x-oauth-basic@github.com".insteadOf "https://github.com"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # 云端编译 + 构建 Docker 镜像
  build:
    runs-on: ubuntu-latest
    needs: [lint]
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      full_image: ${{ steps.meta.outputs.full_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          ref: ${{ inputs.environment == 'prod' && 'main' || 'dev' }}

      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_TAG="${{ inputs.app_type }}-${SHORT_SHA}"
          FULL_IMAGE="${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "full_image=${FULL_IMAGE}" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Configure Go for private repos
        run: git config --global url."https://${{ secrets.CI_GITHUB_TOKEN }}:x-oauth-basic@github.com".insteadOf "https://github.com"

      - name: Build binary
        run: |
          VERSION=$(git describe --tags --always)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X main.Version=${VERSION}" \
            -o ./bin/${{ inputs.app_type }} \
            ./cmd/${{ inputs.app_type }}
          echo "=== 编译完成 ==="
          ls -lh ./bin/${{ inputs.app_type }}

      - name: Build Docker image
        run: |
          docker build \
            -f deploys/Dockerfile.runtime \
            --build-arg RUN_TYPE=${{ inputs.app_type }} \
            -t ${{ steps.meta.outputs.full_image }} \
            .

      - name: Save Docker image as tarball
        run: |
          docker save ${{ steps.meta.outputs.full_image }} | gzip > image.tar.gz
          echo "=== 镜像导出完成 ==="
          ls -lh image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ steps.meta.outputs.image_tag }}
          path: image.tar.gz
          retention-days: 1

  # 内网加载镜像并推送到 Harbor
  push-to-harbor:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ needs.build.outputs.image_tag }}
          path: /tmp/

      - name: Load Docker image
        run: |
          docker load < /tmp/image.tar.gz
          echo "=== 镜像加载完成 ==="
          docker images ${{ needs.build.outputs.full_image }}

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Push image to Harbor
        run: |
          docker push ${{ needs.build.outputs.full_image }}
          echo "镜像推送完成: ${{ needs.build.outputs.full_image }}"

      - name: Clean up
        if: always()
        run: |
          rm -f /tmp/image.tar.gz
          docker rmi ${{ needs.build.outputs.full_image }} 2>/dev/null || true
          docker system prune -f --filter "until=72h" 2>/dev/null || true

  # 更新 Kustomize 配置 (触发 ArgoCD 同步)
  update-manifests:
    runs-on: ubuntu-latest
    needs: [build, push-to-harbor]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.push-to-harbor.result == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          ref: ${{ inputs.environment == 'prod' && 'main' || 'dev' }}

      - name: Install yq
        uses: dcarbone/install-yq-action@v1
        with:
          version: "v4.43.1"

      - name: Update image tag
        run: |
          cd deploys/overlays/${{ inputs.environment }}/images

          APP_TYPE="${{ inputs.app_type }}"
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          IMAGE_NAME="${{ env.APP_NAME }}-${APP_TYPE}"

          export IMAGE_NAME
          export NEW_TAG="$IMAGE_TAG"
          yq -i '.images[] |= select(.name == env(IMAGE_NAME)).newTag = env(NEW_TAG)' kustomization.yaml
          echo "镜像标签已更新: ${IMAGE_NAME} -> ${IMAGE_TAG}"

      - name: Update ConfigMap
        run: |
          ENV="${{ inputs.environment }}"
          if [[ "$ENV" == "prod" ]]; then
            CONFIG_SRC="configs/config.prod.yaml"
          else
            CONFIG_SRC="configs/config.yaml"
          fi
          CONFIG_DST="deploys/overlays/$ENV/config.yaml"

          if ! diff -q "$CONFIG_SRC" "$CONFIG_DST" 2>/dev/null; then
            cp "$CONFIG_SRC" "$CONFIG_DST"
            echo "ConfigMap 配置已更新"
          else
            echo "ConfigMap 配置无变化，跳过"
          fi

      - name: Update Secret (dev only)
        if: inputs.environment == 'dev'
        run: |
          if [[ -f configs/secret.yaml ]]; then
            cp configs/secret.yaml deploys/overlays/${{ inputs.environment }}/secret.yaml
            echo "Secret 配置已更新"
          fi

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add deploys/

          if git diff --staged --quiet; then
            echo "没有需要提交的更改"
          else
            git commit -m "ci: update ${{ inputs.app_type }} image to ${{ needs.build.outputs.image_tag }}

          Environment: ${{ inputs.environment }}
          App: ${{ inputs.app_type }}
          Image: ${{ needs.build.outputs.full_image }}
          Triggered by: ${{ github.actor }}"

            # Retry with rebase to handle concurrent deployments
            for i in 1 2 3; do
              git push && break
              echo "Push failed (attempt $i), retrying with rebase..."
              git pull --rebase
            done
          fi

      - name: Deployment Summary
        run: |
          echo "============================================"
          echo "           部署完成摘要"
          echo "============================================"
          echo ""
          echo "应用类型:     ${{ inputs.app_type }}"
          echo "部署环境:     ${{ inputs.environment }}"
          echo "镜像标签:     ${{ needs.build.outputs.image_tag }}"
          echo "完整镜像:     ${{ needs.build.outputs.full_image }}"
          echo "触发者:       ${{ github.actor }}"
          echo "提交SHA:      ${{ github.sha }}"
          echo ""
          echo "============================================"
          echo "ArgoCD 将自动检测变更并部署到 K8s 集群"
          echo "============================================"
