name: CI

on:
  pull_request:
    branches: [main, dev]

env:
  GO_VERSION: '1.24'
  GOPRIVATE: ${{ vars.GOPRIVATE }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Configure Go for private repos
        run: git config --global url."https://${{ secrets.CI_GITHUB_TOKEN }}:x-oauth-basic@github.com".insteadOf "https://github.com"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, cronjob, job]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Configure Go for private repos
        run: git config --global url."https://${{ secrets.CI_GITHUB_TOKEN }}:x-oauth-basic@github.com".insteadOf "https://github.com"

      - name: Build ${{ matrix.app }}
        run: |
          VERSION=$(git describe --tags --always)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X main.Version=${VERSION}" \
            -o ./bin/${{ matrix.app }} \
            ./cmd/${{ matrix.app }}

